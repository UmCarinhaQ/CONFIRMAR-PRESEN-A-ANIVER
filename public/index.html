<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aniversário do Wellington</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="convite-container">

        <div class="convite-card">

            <span class="convite-label">
                VOCÊ ESTÁ CONVIDADO
            </span>

            <h1>
                Aniversário do
                <strong>Wellington</strong>
            </h1>

            <p class="convite-texto">
                Quero comemorar esse momento
                especial ao lado de pessoas
                importantes para mim.
            </p>


            <div class="informacoes-evento">

                <div class="informacao">

                    <span class="icone">
                        📅
                    </span>

                    <div>

                        <small>
                            DATA
                        </small>

                        <strong>
                            14 de Outubro de 2026
                        </strong>

                    </div>

                </div>


                <div class="informacao">

                    <span class="icone">
                        📍
                    </span>

                    <div>

                        <small>
                            LOCAL
                        </small>

                        <strong>
                            Pizzaria
                        </strong>

                    </div>

                </div>

            </div>


            <a
                href="confirmacao.html"
                class="botao convite-botao"
            >
                CONFIRMAR MINHA PRESENÇA
            </a>


            <p class="rodape-convite">
                Espero você! 🎉
            </p>

        </div>

    </main>

</body>

</html>
