<form id="formConfirmacao">

    <div class="campo">
        <label for="nome">
            Seu nome
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            autocomplete="name"
            required
        >
    </div>

    <div class="campo">
        <label>
            Você irá sozinho?
        </label>

        <label class="checkbox-container">
            <input
                type="checkbox"
                id="sozinho"
            >

            <span>
                Irei sozinho
            </span>
        </label>
    </div>

    <div class="campo">
        <label for="pessoas">
            Quantos acompanhantes irão com você?
        </label>

        <input
            type="number"
            id="pessoas"
            min="0"
            value="0"
            placeholder="Ex: 2"
            required
        >

        <small class="ajuda">
            Não conte você mesmo.
        </small>
    </div>

    <button
        type="submit"
        class="botao"
    >
        CONFIRMAR PRESENÇA
    </button>

</form>
